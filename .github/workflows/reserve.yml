name: Scheduled Release

on:
  push:
    branches:
      - test
      - main
      

jobs:
  reserve-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check reserve time and wait
        run: |
          # 1. 最新のコミットメッセージを取得
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "Commit Message: $COMMIT_MSG"

          # 2. [reserve: YYYY-MM-DD HH:MM] の形式が含まれているかチェック
          if [[ "$COMMIT_MSG" =~ \[reserve:[[:space:]]*([0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]][0-9]{2}:[0-9]{2})\] ]]; then
            RESERVE_TIME="${BASH_REMATCH[1]}"
            echo "予約日時を検知しました: $RESERVE_TIME"

            # 3. 指定された日時を秒（UNIX時間）に変換
            RESERVE_SEC=$(date -d "$RESERVE_TIME" +%s)
            
            while true; do
              CURRENT_SEC=$(date +%s)
              REMAINING=$((RESERVE_SEC - CURRENT_SEC))

              if [ $REMAINING -le 0 ]; then
                echo "予約時間になりました。デプロイ処理を進めます。"
                break
              fi

              # 残り時間がまだある場合は60秒ごとに待機
              echo "指定時間まであと ${REMAINING} 秒です。待機中..."
              sleep 60
            done
          else
            echo "予約日時（[reserve: ...]）が見つからないため、即時処理を実行します。"
          fi

      - name: Deploy / Update process
        run: |
          echo "ここに実際のデプロイや反映のコマンドを記述します"
          # 例: サーバーへの転送やビルドスクリプトなど